<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini‑Pomodoro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <button class="theme-toggle" id="themeBtn">Switch Theme</button>

  <div class="container">
    <div class="sun"></div>
    <div class="moon"></div>

    <div class="card">
      <h1>Pomodoro</h1>
      <div id="time">25:00</div>
      <div>
        <button id="startBtn">Start</button>
        <button id="resetBtn" disabled>Reset</button>
      </div>

      <div class="form-group">
        <label>Work <input id="workLen" type="number" min="1" value="25"> min</label>
        <label>Break <input id="breakLen" type="number" min="1" value="5"> min</label>
      </div>

      <div class="small" id="cycles">Completed pomodoros: 0</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
